<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="badgeShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base background (squircle for standalone badge) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />

  <!-- Inner Decorative Islamic Pattern Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="240" r="156" fill="#03261e" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />

  <!-- Gold Star at Top -->
  <path d="M 256 102 L 263 118 L 280 119 L 267 130 L 271 147 L 256 138 L 241 147 L 245 130 L 232 119 L 249 118 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Crescent & Star Accent -->
  <path d="M 235 155 A 28 28 0 1 0 277 195 A 22 22 0 1 1 235 155 Z" fill="url(#goldGrad)" />
  <circle cx="266" cy="165" r="4.5" fill="#fef08a" />

  <!-- Open Quran / Book Icon -->
  <g transform="translate(166, 215) scale(0.72)" filter="url(#glow)">
    <!-- Book Left Page -->
    <path d="M125 10 C 70 0, 20 15, 5 30 L 5 125 C 25 110, 70 95, 125 105 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <!-- Book Right Page -->
    <path d="M125 10 C 180 0, 230 15, 245 30 L 245 125 C 225 110, 180 95, 125 105 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <!-- Book Spine & Binding -->
    <path d="M120 10 L 130 10 L 130 115 L 120 115 Z" fill="url(#goldGrad)" />
    <!-- Calligraphic page lines -->
    <line x1="28" y1="48" x2="105" y2="44" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="68" x2="105" y2="64" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="88" x2="85" y2="84" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="44" x2="222" y2="48" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="64" x2="222" y2="68" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="165" y1="84" x2="222" y2="88" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Golden Ribbon Banner for App Name -->
  <g transform="translate(256, 360)">
    <!-- Banner Shadow & Backing -->
    <path d="M -180 10 L -150 -18 L 150 -18 L 180 10 L 160 38 L -160 38 Z" fill="#78350f" opacity="0.6" />
    <path d="M -170 4 L -140 -20 L 140 -20 L 170 4 L 148 30 L -148 30 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2" filter="url(#shadow)" />
    <path d="M -160 -10 L 160 -10 L 140 22 L -140 22 Z" fill="url(#badgeShine)" />
    
    <!-- App Name "Dan anty004" -->
    <text x="0" y="14" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#042f2e" text-anchor="middle" letter-spacing="1.5">DAN ANTY004</text>
  </g>

  <!-- Subtitle Tag: Universal Academy & Quran -->
  <text x="256" y="432" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="3" opacity="0.9">UNIVERSAL ACADEMY</text>
  
  <!-- Verified Badge Pill at Bottom -->
  <g transform="translate(256, 465)">
    <rect x="-65" y="-14" width="130" height="26" rx="13" fill="#065f46" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="-42" cy="-1" r="5" fill="#34d399" />
    <text x="5" y="4" font-family="'Outfit', system-ui, sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">OFFICIAL BADGE</text>
  </g>
</svg>
